# Single-host production deployment (ai/CONTAINERS.md §5). Kubernetes (kubernetes/) is the path for multi-node,
# autoscaled deployments. Every rule of CONTAINERS.md §3 and §5 applies here without relaxation.
#
#   1. Create the secrets:   bash scripts/init-secrets.sh prod --admin-email you@example.com
#                            (or: pwsh scripts/init-secrets.ps1 -Mode prod -AdminEmail you@example.com)
#   2. Set the variables:    cp .env.prod.example .env.prod   (API_ALLOWED_HOSTS, JWT_ISSUER)
#   3. Build and deploy:     docker compose --env-file .env.prod -f docker-compose-prod.yml up -d --build
#      (--env-file keeps the development .env out of the production stack)
#
# - The images are built on this host from the Dockerfile (targets `runtime` and `migrations`) and tagged
#   pf-ecommerce-api:local and pf-ecommerce-migrations:local: no registry is involved (docs/container-exceptions.md
#   EX-007). To deploy images from a registry instead, set API_IMAGE and MIGRATIONS_IMAGE to
#   registry/name:<version>@sha256:<digest> (never `latest`) in .env.prod and run `docker compose pull` before `up`.
# - Backing-service images are pinned by digest; `latest` is forbidden. Versions match docker-compose-dev.yml.
# - Secrets are files (./secrets, untracked, ai/SECURITY.md §5); nothing sensitive is an environment variable
#   or a command-line argument of the application.
# - TLS terminates at an external reverse proxy or load balancer that forwards to API_BIND_ADDRESS:API_PORT. It must
#   never route /health/*, /metrics, or the observability backends to the internet (ai/SECURITY.md §6.3).
# - Networks: `backend` and `observability` are internal (no route out of the host); only the API joins `edge`.
# - The database is provisioned and migrated by one-shot jobs before the API starts (ai/DATABASE.md §6.1): roles and
#   schemas (db-provision), one EF Core migrations bundle per bounded context run as app_migrator, then the grants
#   (db-grant). The API connects as app_runtime, which can read and write rows but change no schema.
name: pf-ecommerce

# Local builds of the two images (see the header). The API and the worker run the same image, so both services carry the
# same build: BuildKit's cache makes the second one a no-op, and neither depends on the other having been built first.
x-api-build: &api-build
    context: .
    dockerfile: Dockerfile
    target: runtime
    args:
        VERSION: "${API_VERSION:-0.0.0-local}"

x-migrations-build: &migrations-build
    context: .
    dockerfile: Dockerfile
    target: migrations
    args:
        VERSION: "${API_VERSION:-0.0.0-local}"

x-hardening: &hardening
    read_only: true
    cap_drop: [ALL]
    security_opt:
        - no-new-privileges:true
    restart: unless-stopped
    logging:
        driver: json-file
        options:
            max-size: "10m"
            max-file: "5"

# One-shot database jobs: same hardening, no restart, only the internal backend network.
x-db-job: &db-job
    read_only: true
    cap_drop: [ALL]
    security_opt:
        - no-new-privileges:true
    restart: "no"
    networks:
        - backend
    logging:
        driver: json-file
        options:
            max-size: "10m"
            max-file: "3"

# Provisioning of roles, schemas, and grants: psql from the pinned PostgreSQL image, secrets read from files.
x-db-provision: &db-provision
    <<: *db-job
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    user: "70:70"
    entrypoint: ["sh", "/provision/provision.sh"]
    volumes:
        - ./database/provision.sh:/provision/provision.sh:ro
        - ./database/provision-roles.sql:/provision/provision-roles.sql:ro
    secrets:
        - postgres_password
        - postgres_migrator_password
        - postgres_runtime_password
        - postgres_readonly_password

# One EF Core migrations bundle; the connection string is a secret file, never an argument or a variable.
x-db-migrate: &db-migrate
    <<: *db-job
    image: ${MIGRATIONS_IMAGE:-pf-ecommerce-migrations:local}
    build: *migrations-build
    environment:
        PF_DESIGN_TIME_CONNECTION_FILE: /run/secrets/conn_postgres_migrator
        # A single-file bundle unpacks its native libraries; the root filesystem is read-only, /tmp is a tmpfs.
        DOTNET_BUNDLE_EXTRACT_BASE_DIR: /tmp
    secrets:
        - conn_postgres_migrator
    tmpfs:
        - /tmp:size=64m,mode=1777

services:
    ecommerce-api:
        <<: *hardening
        image: ${API_IMAGE:-pf-ecommerce-api:local}
        build: *api-build
        ports:
            - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
        environment:
            ASPNETCORE_ENVIRONMENT: Production
            # "localhost" is appended for the container healthcheck: `--health-check` calls http://localhost:8080, and
            # host filtering answers 400 to any Host that is not listed, which would keep the container unhealthy.
            AllowedHosts: "${API_ALLOWED_HOSTS:?set API_ALLOWED_HOSTS to the public host name(s), separated by ;};localhost"
            Jwt__Issuer: "${JWT_ISSUER:?set JWT_ISSUER to the public https URL of the API}"
            Jwt__ActiveKeyId: "${JWT_ACTIVE_KEY_ID:-key-1}"
            Jwt__Keys__0__Id: "${JWT_ACTIVE_KEY_ID:-key-1}"
            Jwt__Keys__0__PrivateKeyPemFile: /run/secrets/jwt_es384_private_key
            Identity__Bootstrap__Accounts__0__AccessLevel: administrator
            OTEL_SERVICE_NAME: ecommerce-api
            OTEL_RESOURCE_ATTRIBUTES: "deployment.environment.name=production,service.version=${API_VERSION:-unknown},app.owner=${APP_OWNER:-team-platform}"
            OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
            OTEL_EXPORTER_OTLP_PROTOCOL: grpc
            OTEL_PROPAGATORS: tracecontext,baggage
            # Full head sampling: the Collector tail-samples (errors, slow traces, 10 % of the rest).
            OTEL_TRACES_SAMPLER: parentbased_traceidratio
            OTEL_TRACES_SAMPLER_ARG: "1.0"
            OTEL_METRICS_EXEMPLAR_FILTER: trace_based
            OTEL_METRIC_EXPORT_INTERVAL: "30000"
            OTEL_ATTRIBUTE_VALUE_LENGTH_LIMIT: "2048"
            OTEL_SEMCONV_STABILITY_OPT_IN: http,database
        # Secrets are mounted as files. Names containing "__" become configuration keys (Program.cs); the key
        # file is read from its path. Connection strings and credentials never appear in the environment.
        secrets:
            - source: jwt_es384_private_key
              target: jwt_es384_private_key
            - source: identity_token_hash_key
              target: Identity__TokenHashKey
            - source: pagination_cursor_key
              target: Pagination__CursorKey
            - source: bootstrap_admin_email
              target: Identity__Bootstrap__Accounts__0__Email
            - source: bootstrap_admin_password
              target: Identity__Bootstrap__Accounts__0__Password
            - source: conn_postgres
              target: ConnectionStrings__Postgres
            - source: conn_valkey
              target: ConnectionStrings__Valkey
            - source: conn_rabbitmq
              target: ConnectionStrings__RabbitMQ
        tmpfs:
            - /tmp:size=64m,mode=1777
        healthcheck:
            # App-provided probe mode: the chiseled runtime image ships no shell, curl, or wget.
            test: ["CMD", "dotnet", "Portfolio.dll", "--health-check"]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 20s
        deploy:
            resources:
                limits:
                    pids: 256
                    cpus: "1.0"
                    memory: 512M
        # Larger than HostOptions.ShutdownTimeout (25 s), so the host drains before Docker kills it.
        stop_grace_period: 35s
        depends_on:
            db-grant:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
            valkey:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            otel-collector:
                condition: service_started
        networks:
            - edge
            - backend
            - observability

    # The worker role (ai/CONTAINERS.md §6.1): the same image, selected by configuration. It runs the outbox relays and the
    # message consumers, publishes no port and joins no edge network. Scale it independently of the API; every instance is
    # safe beside the others (the relay claims rows with SKIP LOCKED, consumers deduplicate through the inbox).
    ecommerce-worker:
        <<: *hardening
        image: ${API_IMAGE:-pf-ecommerce-api:local}
        build: *api-build
        environment:
            ASPNETCORE_ENVIRONMENT: Production
            # "localhost" is appended for the container healthcheck (see ecommerce-api).
            AllowedHosts: "${API_ALLOWED_HOSTS:?set API_ALLOWED_HOSTS to the public host name(s), separated by ;};localhost"
            Jwt__Issuer: "${JWT_ISSUER:?set JWT_ISSUER to the public https URL of the API}"
            Jwt__ActiveKeyId: "${JWT_ACTIVE_KEY_ID:-key-1}"
            Jwt__Keys__0__Id: "${JWT_ACTIVE_KEY_ID:-key-1}"
            Jwt__Keys__0__PrivateKeyPemFile: /run/secrets/jwt_es384_private_key
            Outbox__Relay__Enabled: "true"
            RabbitMq__ConsumersEnabled: "true"
            OTEL_SERVICE_NAME: ecommerce-worker
            OTEL_RESOURCE_ATTRIBUTES: "deployment.environment.name=production,service.version=${API_VERSION:-unknown},app.owner=${APP_OWNER:-team-platform}"
            OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
            OTEL_EXPORTER_OTLP_PROTOCOL: grpc
            OTEL_PROPAGATORS: tracecontext,baggage
            OTEL_TRACES_SAMPLER: parentbased_traceidratio
            OTEL_TRACES_SAMPLER_ARG: "1.0"
            OTEL_METRICS_EXEMPLAR_FILTER: trace_based
            OTEL_METRIC_EXPORT_INTERVAL: "30000"
            OTEL_ATTRIBUTE_VALUE_LENGTH_LIMIT: "2048"
            OTEL_SEMCONV_STABILITY_OPT_IN: http,database
        # No bootstrap-account secrets: only the API creates the first accounts.
        secrets:
            - source: jwt_es384_private_key
              target: jwt_es384_private_key
            - source: identity_token_hash_key
              target: Identity__TokenHashKey
            - source: pagination_cursor_key
              target: Pagination__CursorKey
            - source: conn_postgres
              target: ConnectionStrings__Postgres
            - source: conn_valkey
              target: ConnectionStrings__Valkey
            - source: conn_rabbitmq
              target: ConnectionStrings__RabbitMQ
        tmpfs:
            - /tmp:size=64m,mode=1777
        healthcheck:
            test: ["CMD", "dotnet", "Portfolio.dll", "--health-check"]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 20s
        deploy:
            resources:
                limits:
                    pids: 256
                    cpus: "1.0"
                    memory: 512M
        stop_grace_period: 35s
        depends_on:
            db-grant:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
            valkey:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            otel-collector:
                condition: service_started
        networks:
            - backend
            - observability

    db-provision:
        <<: *db-provision
        depends_on:
            postgres:
                condition: service_healthy

    db-migrate-identity:
        <<: *db-migrate
        entrypoint: ["/migrations/migrate-identity"]
        depends_on:
            db-provision:
                condition: service_completed_successfully

    db-migrate-catalog:
        <<: *db-migrate
        entrypoint: ["/migrations/migrate-catalog"]
        depends_on:
            db-migrate-identity:
                condition: service_completed_successfully

    db-migrate-inventory:
        <<: *db-migrate
        entrypoint: ["/migrations/migrate-inventory"]
        depends_on:
            db-migrate-catalog:
                condition: service_completed_successfully

    db-migrate-customers:
        <<: *db-migrate
        entrypoint: ["/migrations/migrate-customers"]
        depends_on:
            db-migrate-inventory:
                condition: service_completed_successfully

    db-migrate-cart:
        <<: *db-migrate
        entrypoint: ["/migrations/migrate-cart"]
        depends_on:
            db-migrate-customers:
                condition: service_completed_successfully

    db-migrate-ordering:
        <<: *db-migrate
        entrypoint: ["/migrations/migrate-ordering"]
        depends_on:
            db-migrate-cart:
                condition: service_completed_successfully

    db-migrate-shipping:
        <<: *db-migrate
        entrypoint: ["/migrations/migrate-shipping"]
        depends_on:
            db-migrate-ordering:
                condition: service_completed_successfully

    # Runs the provisioning again: the grants now cover the tables the migrations created, and the runtime role
    # is denied the migration history.
    db-grant:
        <<: *db-provision
        depends_on:
            db-migrate-shipping:
                condition: service_completed_successfully

    postgres:
        <<: *hardening
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        user: "70:70"
        environment:
            POSTGRES_DB: ecommerce
            POSTGRES_USER: app
            POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
        secrets:
            - postgres_password
        volumes:
            - pgdata:/var/lib/postgresql
        tmpfs:
            - /tmp:size=64m,mode=1777
            - /run/postgresql:size=8m,uid=70,gid=70
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U app -d ecommerce"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        deploy:
            resources:
                limits:
                    pids: 256
                    cpus: "2.0"
                    memory: 1G
        stop_grace_period: 60s
        networks:
            - backend

    valkey:
        <<: *hardening
        image: valkey/valkey:9.1.2-alpine3.24@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
        user: "999:1000"
        # A cache, not a source of truth (ai/DATABASE.md §4): no persistence, bounded memory, LRU eviction.
        # Valkey cannot read its password from a file, so the (alpine) entrypoint writes a configuration file into the
        # tmpfs from the secret: the password is never in the compose file, the environment, or the process arguments.
        # It fails closed: an empty or unreadable secret would otherwise start Valkey with no authentication at all.
        entrypoint:
            - sh
            - -c
            - |
                umask 077
                password="$$(cat /run/secrets/valkey_password)"
                [ -n "$$password" ] || { echo "the valkey_password secret is empty or unreadable" >&2; exit 1; }
                printf 'requirepass "%s"\n' "$$password" > /tmp/valkey.conf
                exec valkey-server /tmp/valkey.conf --save "" --appendonly no --maxmemory 192mb --maxmemory-policy allkeys-lru
        secrets:
            - valkey_password
        tmpfs:
            - /tmp:size=16m,mode=1777
            - /data:size=16m,uid=999,gid=1000 # working directory; nothing is persisted
        healthcheck:
            test: ["CMD-SHELL", 'REDISCLI_AUTH="$$(cat /run/secrets/valkey_password)" valkey-cli ping | grep -q PONG']
            interval: 10s
            timeout: 5s
            retries: 5
        deploy:
            resources:
                limits:
                    pids: 128
                    cpus: "0.5"
                    memory: 256M
        networks:
            - backend

    rabbitmq:
        <<: *hardening
        image: rabbitmq:4.3.6-alpine@sha256:2cb43283d8bbd3caa6c0f0dc00e96c8de772df33df7fd8af6aee4d605aeb8ada
        user: "100:101"
        hostname: rabbitmq
        environment:
            # Logs go to stdout only (ai/CONTAINERS.md §3.5); the filesystem is read-only.
            RABBITMQ_LOGS: "-"
        # RabbitMQ 4.3 deprecates RABBITMQ_DEFAULT_*_FILE: the credentials are a configuration file delivered as a
        # secret (default_user / default_pass), mounted next to the generated defaults.
        secrets:
            - source: rabbitmq_credentials
              target: /etc/rabbitmq/conf.d/20-credentials.conf
        volumes:
            - rabbitmqdata:/var/lib/rabbitmq
        tmpfs:
            - /tmp:size=32m,mode=1777
            - /etc/rabbitmq/conf.d:size=1m,uid=100,gid=101
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 15s
            timeout: 10s
            retries: 5
            start_period: 30s
        deploy:
            resources:
                limits:
                    pids: 512
                    cpus: "1.0"
                    memory: 512M
        stop_grace_period: 60s
        networks:
            - backend

    otel-collector:
        <<: *hardening
        image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
        command: ["--config=/etc/otelcol/config.yaml"]
        user: "10001:10001"
        volumes:
            - ./observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
        # No healthcheck: the image is distroless with no probe command (docs/container-exceptions.md EX-001). The
        # health_check extension exists on the internal network; restart: unless-stopped recovers a crash.
        deploy:
            resources:
                limits:
                    pids: 128
                    cpus: "0.5"
                    memory: 256M
        depends_on:
            prometheus:
                condition: service_healthy
            loki:
                condition: service_started
            tempo:
                condition: service_healthy
        networks:
            - observability

    prometheus:
        <<: *hardening
        image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
        user: "65534:65534"
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --web.enable-otlp-receiver
            - --web.console.libraries=/usr/share/prometheus/console_libraries
        volumes:
            - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheusdata:/prometheus
        tmpfs:
            - /tmp:size=16m,mode=1777
        healthcheck:
            test: ["CMD", "promtool", "check", "healthy", "--url=http://localhost:9090"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 20s
        deploy:
            resources:
                limits:
                    pids: 256
                    cpus: "1.0"
                    memory: 512M
        networks:
            - observability

    loki:
        <<: *hardening
        image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
        user: "10001:10001"
        command: ["-config.file=/etc/loki/loki.yaml"]
        volumes:
            - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
            - lokidata:/loki
        tmpfs:
            - /tmp:size=32m,mode=1777
        # No healthcheck: the image is distroless and Loki has no probe command (docs/container-exceptions.md EX-001).
        deploy:
            resources:
                limits:
                    pids: 256
                    cpus: "1.0"
                    memory: 512M
        networks:
            - observability

    tempo:
        <<: *hardening
        image: grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
        user: "10001:10001"
        command: ["-config.file=/etc/tempo/tempo.yaml"]
        volumes:
            - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
            - tempodata:/var/tempo
        tmpfs:
            - /tmp:size=32m,mode=1777
        healthcheck:
            test: ["CMD", "/tempo", "-health"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 20s
        deploy:
            resources:
                limits:
                    pids: 256
                    cpus: "1.0"
                    memory: 512M
        networks:
            - observability

    # The only observability component reachable from outside the host network, and only behind SSO at the
    # reverse proxy (ai/OBSERVABILITY.md §13): bind it to loopback and let the proxy publish it.
    grafana:
        <<: *hardening
        image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
        user: "472:472"
        ports:
            - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
        environment:
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
            # Console only: the root filesystem is read-only, and the default `console file` mode would try to open
            # /var/log/grafana/grafana.log (ai/CONTAINERS.md §3.5: no log files inside the container).
            GF_LOG_MODE: console
            GF_USERS_ALLOW_SIGN_UP: "false"
            GF_AUTH_ANONYMOUS_ENABLED: "false"
            GF_SECURITY_DISABLE_GRAVATAR: "true"
            GF_ANALYTICS_REPORTING_ENABLED: "false"
            GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
            GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
            # No plugin downloads at runtime: the image already bundles what the data sources need.
            GF_PLUGINS_PREINSTALL_DISABLED: "true"
            GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
            GF_SECURITY_COOKIE_SECURE: "true"
            GF_SECURITY_COOKIE_SAMESITE: strict
        secrets:
            - grafana_admin_password
        volumes:
            - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
            - grafanadata:/var/lib/grafana
        tmpfs:
            - /tmp:size=32m,mode=1777
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
            interval: 20s
            timeout: 10s
            retries: 5
            start_period: 30s
        deploy:
            resources:
                limits:
                    pids: 256
                    cpus: "0.5"
                    memory: 256M
        depends_on:
            prometheus:
                condition: service_healthy
            loki:
                condition: service_started
            tempo:
                condition: service_healthy
        networks:
            - observability
            - edge

volumes:
    pgdata:
    rabbitmqdata:
    prometheusdata:
    lokidata:
    tempodata:
    grafanadata:

networks:
    # External-facing: the API (published to the reverse proxy) and Grafana (behind SSO).
    edge:
        driver: bridge
    # Application backing services. No route out of the host.
    backend:
        driver: bridge
        internal: true
    # Telemetry pipeline. No route out of the host.
    observability:
        driver: bridge
        internal: true

# File-based secrets (ai/SECURITY.md §5.3). Create them with scripts/init-secrets.*; ./secrets is untracked.
secrets:
    postgres_password:
        file: ./secrets/postgres_password.txt
    valkey_password:
        file: ./secrets/valkey_password.txt
    rabbitmq_credentials:
        file: ./secrets/rabbitmq_credentials.conf
    grafana_admin_password:
        file: ./secrets/grafana_admin_password.txt
    jwt_es384_private_key:
        file: ./secrets/jwt_es384_private_key.pem
    identity_token_hash_key:
        file: ./secrets/identity_token_hash_key.txt
    pagination_cursor_key:
        file: ./secrets/pagination_cursor_key.txt
    bootstrap_admin_email:
        file: ./secrets/bootstrap_admin_email.txt
    bootstrap_admin_password:
        file: ./secrets/bootstrap_admin_password.txt
    postgres_migrator_password:
        file: ./secrets/postgres_migrator_password.txt
    postgres_runtime_password:
        file: ./secrets/postgres_runtime_password.txt
    postgres_readonly_password:
        file: ./secrets/postgres_readonly_password.txt
    conn_postgres:
        file: ./secrets/conn_postgres.txt
    conn_postgres_migrator:
        file: ./secrets/conn_postgres_migrator.txt
    conn_valkey:
        file: ./secrets/conn_valkey.txt
    conn_rabbitmq:
        file: ./secrets/conn_rabbitmq.txt
