# The credentials of the release Job, from the secret manager (ai/SECURITY.md §5). Two Secrets, mounted in different
# containers: the instance admin and the role passwords reach only the provisioning steps; the DDL-capable connection reaches
# only the migration bundles. The runtime and read-only passwords here must equal the ones inside
# postgres-runtime-connection (the application) and the reporting tool's connection: provisioning sets the role passwords.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    name: ecommerce-db-provisioning
    labels:
        app.kubernetes.io/name: ecommerce-db-release
spec:
    refreshInterval: 1h
    secretStoreRef:
        kind: SecretStore
        name: ecommerce-secrets
    target:
        name: ecommerce-db-provisioning
        creationPolicy: Owner
    data:
        - secretKey: postgres_password
          remoteRef: { key: postgres-admin-credentials, property: password }
        - secretKey: postgres_migrator_password
          remoteRef: { key: postgres-migrator-password }
        - secretKey: postgres_runtime_password
          remoteRef: { key: postgres-runtime-password }
        - secretKey: postgres_readonly_password
          remoteRef: { key: postgres-readonly-password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    name: ecommerce-db-migrator
    labels:
        app.kubernetes.io/name: ecommerce-db-release
spec:
    refreshInterval: 1h
    secretStoreRef:
        kind: SecretStore
        name: ecommerce-secrets
    target:
        name: ecommerce-db-migrator
        creationPolicy: Owner
    data:
        - secretKey: conn_postgres_migrator
          remoteRef: { key: postgres-migrator-connection }
