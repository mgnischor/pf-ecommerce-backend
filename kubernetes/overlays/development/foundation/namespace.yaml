# Namespace per environment, labeled for the restricted Pod Security Standard (ai/CONTAINERS.md §3.1, §7.1).
apiVersion: v1
kind: Namespace
metadata:
    name: ecommerce-dev
    labels:
        environment: development
        team: platform
        cost-center: ecommerce
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: latest
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
    name: ecommerce
    namespace: ecommerce-dev
spec:
    hard:
        requests.cpu: "6"
        requests.memory: 12Gi
        limits.cpu: "12"
        limits.memory: 16Gi
        pods: "40"
        persistentvolumeclaims: "6"
        requests.storage: 100Gi
        services.loadbalancers: "0"
        services.nodeports: "0"
---
# Defaults and bounds that catch a container declared without resources (ai/CONTAINERS.md §7.2).
apiVersion: v1
kind: LimitRange
metadata:
    name: default-limits
    namespace: ecommerce-dev
spec:
    limits:
        - type: Container
          default:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 200Mi
          defaultRequest:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 50Mi
          max:
              cpu: "2"
              memory: 2Gi
          min:
              cpu: 50m
              memory: 64Mi
