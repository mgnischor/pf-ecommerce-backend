# Where External Secrets Operator reads this environment secrets (AWS Secrets Manager). The containers are created by
# infrastructure/aws (secrets.tf) as pf-ecommerce-production/<name>; the prefix below lets the ExternalSecrets in base/ use the
# bare names. ESO authenticates with its own cloud identity (EKS Pod Identity, infrastructure/aws/secrets.tf), so no
# credential appears here. On another cloud, replace the provider block and keep the store name.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
    name: ecommerce-secrets
    namespace: ecommerce-production
spec:
    provider:
        aws:
            service: SecretsManager
            region: us-east-1
            prefix: pf-ecommerce-production/
