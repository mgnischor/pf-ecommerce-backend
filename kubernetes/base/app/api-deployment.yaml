# API role: serves HTTP on 8080 (ai/CONTAINERS.md §6.1). Stateless; scales on CPU (api-hpa.yaml).
# The worker role (worker-deployment.yaml) runs the same image with the outbox relays and the message consumers.
apiVersion: apps/v1
kind: Deployment
metadata:
    name: ecommerce-api
    labels:
        app.kubernetes.io/name: ecommerce-api
        app.kubernetes.io/component: api
spec:
    replicas: 2
    revisionHistoryLimit: 10
    progressDeadlineSeconds: 300
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: ecommerce-api
    template:
        metadata:
            labels:
                app.kubernetes.io/name: ecommerce-api
                app.kubernetes.io/component: api
        spec:
            serviceAccountName: ecommerce-app
            automountServiceAccountToken: false
            priorityClassName: ecommerce-critical
            # Larger than HostOptions.ShutdownTimeout (25 s) plus the preStop delay (ai/CONTAINERS.md §8.2).
            terminationGracePeriodSeconds: 60
            securityContext:
                runAsNonRoot: true
                runAsUser: 1654 # the .NET image's non-root "app" user
                runAsGroup: 1654
                fsGroup: 1654
                seccompProfile:
                    type: RuntimeDefault
            topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: topology.kubernetes.io/zone
                  whenUnsatisfiable: ScheduleAnyway
                  labelSelector:
                      matchLabels:
                          app.kubernetes.io/name: ecommerce-api
            affinity:
                podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 100
                          podAffinityTerm:
                              topologyKey: kubernetes.io/hostname
                              labelSelector:
                                  matchLabels:
                                      app.kubernetes.io/name: ecommerce-api
            containers:
                - name: ecommerce-api
                  # Pinned by digest in each overlay (images:). Never a floating tag.
                  image: registry.example.com/ecommerce-api
                  imagePullPolicy: IfNotPresent
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop: ["ALL"]
                  ports:
                      - name: http
                        containerPort: 8080
                        protocol: TCP
                  envFrom:
                      - configMapRef:
                            name: ecommerce-config
                  env:
                      # Static part of the resource attributes (environment, owner), from the ConfigMap; it must come first
                      # because $(VAR) only expands variables defined above it.
                      - name: OTEL_RESOURCE_ATTRIBUTES_STATIC
                        valueFrom:
                            configMapKeyRef:
                                name: ecommerce-config
                                key: OTEL_RESOURCE_ATTRIBUTES_STATIC
                      - name: OTEL_SERVICE_NAME
                        value: ecommerce-api
                      - name: K8S_POD_NAME
                        valueFrom:
                            fieldRef:
                                fieldPath: metadata.name
                      - name: K8S_NAMESPACE_NAME
                        valueFrom:
                            fieldRef:
                                fieldPath: metadata.namespace
                      - name: APP_VERSION
                        valueFrom:
                            fieldRef:
                                fieldPath: metadata.labels['app.kubernetes.io/version']
                      # $(VAR) is expanded by Kubernetes from the variables defined above it.
                      - name: OTEL_RESOURCE_ATTRIBUTES
                        value: "service.version=$(APP_VERSION),k8s.pod.name=$(K8S_POD_NAME),k8s.namespace.name=$(K8S_NAMESPACE_NAME),$(OTEL_RESOURCE_ATTRIBUTES_STATIC)"
                  resources:
                      requests:
                          cpu: 250m
                          memory: 256Mi
                          ephemeral-storage: 100Mi
                      limits:
                          cpu: "1"
                          memory: 512Mi
                          ephemeral-storage: 500Mi
                  startupProbe:
                      httpGet:
                          path: /health/live
                          port: http
                          httpHeaders:
                              # Host filtering (AllowedHosts) answers 400 to the Pod IP the kubelet sends by default, so every probe sets Host: localhost (kept in AllowedHosts).
                              - name: Host
                                value: localhost
                      periodSeconds: 5
                      failureThreshold: 30
                  livenessProbe:
                      httpGet:
                          path: /health/live
                          port: http
                          httpHeaders:
                              - name: Host
                                value: localhost
                      periodSeconds: 15
                      timeoutSeconds: 3
                      failureThreshold: 3
                  readinessProbe:
                      httpGet:
                          path: /health/ready
                          port: http
                          httpHeaders:
                              - name: Host
                                value: localhost
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                  lifecycle:
                      preStop:
                          sleep:
                              seconds: 5 # lets the Service deregister the Pod before SIGTERM; needs no shell
                  volumeMounts:
                      - name: tmp
                        mountPath: /tmp
                      # Files named Setting__Name become configuration (AddKeyPerFile, Program.cs).
                      - name: secrets
                        mountPath: /run/secrets
                        readOnly: true
            volumes:
                - name: tmp
                  emptyDir:
                      medium: Memory
                      sizeLimit: 64Mi
                - name: secrets
                  projected:
                      defaultMode: 0440
                      sources:
                          - secret:
                                name: ecommerce-app-secrets
                          - secret:
                                name: ecommerce-api-bootstrap
