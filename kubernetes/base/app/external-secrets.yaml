# Secrets come from the secret manager through External Secrets Operator; no Secret value is ever committed
# (ai/CONTAINERS.md §6.4, ai/SECURITY.md §5). The SecretStore named below is defined per environment in the overlay, with the
# provider's authentication and the environment prefix, so these remote keys are the same everywhere.
#
# The resulting Secrets are mounted as FILES under /run/secrets. A file whose name contains "__" becomes a configuration key
# (Identity__TokenHashKey -> Identity:TokenHashKey); the JWT key is read from its path (Jwt__Keys__0__PrivateKeyPemFile).
#
# Rotation: a changed value reaches the Pod when ESO refreshes the Secret and the kubelet updates the projected files; the
# application reads them at start, so roll the Deployments after a rotation (kubectl rollout restart).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    name: ecommerce-app-secrets
    labels:
        app.kubernetes.io/name: ecommerce-app
spec:
    refreshInterval: 1h
    secretStoreRef:
        kind: SecretStore
        name: ecommerce-secrets
    target:
        name: ecommerce-app-secrets
        creationPolicy: Owner
        template:
            engineVersion: v2
            data:
                jwt_es384_private_key: "{{ .jwt_signing_key }}"
                Identity__TokenHashKey: "{{ .identity_token_hash_key }}"
                ConnectionStrings__Postgres: "{{ .postgres_runtime_connection }}"
                ConnectionStrings__Valkey: "{{ .valkey_connection }}"
                ConnectionStrings__RabbitMQ: "amqp://{{ .rabbitmq_username | urlquery }}:{{ .rabbitmq_password | urlquery }}@ecommerce-rabbitmq:5672"
    data:
        - secretKey: jwt_signing_key
          remoteRef: { key: jwt-signing-key }
        - secretKey: identity_token_hash_key
          remoteRef: { key: identity-token-hash-key }
        - secretKey: postgres_runtime_connection
          remoteRef: { key: postgres-runtime-connection }
        - secretKey: valkey_connection
          remoteRef: { key: valkey-connection }
        - secretKey: rabbitmq_username
          remoteRef: { key: rabbitmq-credentials, property: username }
        - secretKey: rabbitmq_password
          remoteRef: { key: rabbitmq-credentials, property: password }
---
# The first administrator, created by the API at start (Identity:Bootstrap). Mounted in the API only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    name: ecommerce-api-bootstrap
    labels:
        app.kubernetes.io/name: ecommerce-api
spec:
    refreshInterval: 1h
    secretStoreRef:
        kind: SecretStore
        name: ecommerce-secrets
    target:
        name: ecommerce-api-bootstrap
        creationPolicy: Owner
        template:
            engineVersion: v2
            data:
                Identity__Bootstrap__Accounts__0__Email: "{{ .email }}"
                Identity__Bootstrap__Accounts__0__Password: "{{ .password }}"
    data:
        - secretKey: email
          remoteRef: { key: identity-bootstrap-admin, property: email }
        - secretKey: password
          remoteRef: { key: identity-bootstrap-admin, property: password }
---
# How KEDA reaches RabbitMQ to read queue depths. KEDA runs in its own namespace, so the host must be fully qualified:
# every overlay replaces NAMESPACE with its namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    name: ecommerce-keda-rabbitmq
    labels:
        app.kubernetes.io/name: ecommerce-worker
spec:
    refreshInterval: 1h
    secretStoreRef:
        kind: SecretStore
        name: ecommerce-secrets
    target:
        name: ecommerce-keda-rabbitmq
        creationPolicy: Owner
        template:
            engineVersion: v2
            data:
                host: "amqp://{{ .rabbitmq_username | urlquery }}:{{ .rabbitmq_password | urlquery }}@ecommerce-rabbitmq.NAMESPACE.svc.cluster.local:5672"
    data:
        - secretKey: rabbitmq_username
          remoteRef: { key: rabbitmq-credentials, property: username }
        - secretKey: rabbitmq_password
          remoteRef: { key: rabbitmq-credentials, property: password }
