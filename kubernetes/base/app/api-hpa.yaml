# CPU is the signal the cluster always has. ai/CONTAINERS.md §6.5 also asks for a request-rate or latency metric: add it in the
# overlay once a custom-metrics adapter (Prometheus Adapter or KEDA) serves http.server.request.duration / request rate, as a
# `Pods` or `External` entry under metrics. maxReplicas x Database:MaxPoolSize (20) plus the workers' must stay below the
# PostgreSQL connection limit (see kubernetes/README.md, "Connection budget").
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
    name: ecommerce-api
    labels:
        app.kubernetes.io/name: ecommerce-api
        app.kubernetes.io/component: api
spec:
    scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: ecommerce-api
    minReplicas: 2
    maxReplicas: 6
    behavior:
        scaleDown:
            stabilizationWindowSeconds: 300
            policies:
                - type: Percent
                  value: 10
                  periodSeconds: 60
        scaleUp:
            stabilizationWindowSeconds: 0
            policies:
                - type: Percent
                  value: 100
                  periodSeconds: 30
    metrics:
        - type: Resource
          resource:
              name: cpu
              target:
                  type: Utilization
                  averageUtilization: 70
