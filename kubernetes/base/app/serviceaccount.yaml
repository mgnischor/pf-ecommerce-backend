# The application never calls the Kubernetes API (ai/CONTAINERS.md §6.1): no token is mounted, and the account has no
# Role or ClusterRole bound to it. Cloud workload identity, if an overlay needs it, is an annotation added there.
apiVersion: v1
kind: ServiceAccount
metadata:
    name: ecommerce-app
    labels:
        app.kubernetes.io/name: ecommerce-app
automountServiceAccountToken: false
