# The default user of the broker, built from the same secret the application connection string is built from
# (rabbitmq-credentials, a JSON object with "username" and "password"), so the two can never disagree.
# The operator expects username, password and default_user.conf in this Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    name: ecommerce-rabbitmq-default-user
    labels:
        app.kubernetes.io/name: ecommerce-rabbitmq
spec:
    refreshInterval: 1h
    secretStoreRef:
        kind: SecretStore
        name: ecommerce-secrets
    target:
        name: ecommerce-rabbitmq-default-user
        creationPolicy: Owner
        template:
            engineVersion: v2
            data:
                username: "{{ .username }}"
                password: "{{ .password }}"
                default_user.conf: |
                    default_user = {{ .username }}
                    default_pass = {{ .password }}
    data:
        - secretKey: username
          remoteRef: { key: rabbitmq-credentials, property: username }
        - secretKey: password
          remoteRef: { key: rabbitmq-credentials, property: password }
