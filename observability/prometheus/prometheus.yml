# Prometheus for the single-host deployment. Application metrics arrive over OTLP push (the Collector writes to
# /api/v1/otlp), so there is nothing to scrape: a metric travels exactly one path (ai/OBSERVABILITY.md §5.7).
global:
    scrape_interval: 30s
    evaluation_interval: 30s
    external_labels:
        deployment: single-host

# Prometheus' own metrics are scraped so the backend is observable too.
scrape_configs:
    - job_name: prometheus
      static_configs:
          - targets: ["localhost:9090"]
