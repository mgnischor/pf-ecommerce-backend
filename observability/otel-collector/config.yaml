# OpenTelemetry Collector pipeline for the single-host (Compose) deployment (ai/OBSERVABILITY.md §12.3).
# The application pushes OTLP here; the Collector redacts, samples, and fans out to the backends.
# Validate with:  docker run --rm -v ./observability/otel-collector:/etc/otelcol:ro \
#                   otel/opentelemetry-collector-contrib:0.161.0 validate --config=/etc/otelcol/config.yaml

receivers:
    otlp:
        protocols:
            grpc:
                endpoint: 0.0.0.0:4317
            http:
                endpoint: 0.0.0.0:4318

processors:
    # Must come first: sheds load instead of letting the Collector be OOM-killed (the app keeps working).
    memory_limiter:
        check_interval: 1s
        limit_mib: 200
        spike_limit_mib: 50

    # Defense in depth: the application redacts at the source; the Collector scrubs what slips through.
    redaction:
        allow_all_keys: true
        blocked_key_patterns:
            - (?i)^(authorization|cookie|set-cookie|x-api-key|x-webhook-signature)$
            - (?i).*(password|passwd|secret|token|api[_-]?key|card[_-]?number|cvv).*
        blocked_values:
            - "[A-Za-z0-9-_]{20,}\\.[A-Za-z0-9-_]{20,}\\.[A-Za-z0-9-_]{20,}" # JWTs
            - "\\b(?:\\d[ -]?){13,19}\\b" # card-like numbers
        summary: info

    # Keep every error trace, every slow trace, and 10% of the rest (ai/OBSERVABILITY.md §9.3).
    tail_sampling:
        decision_wait: 10s
        num_traces: 50000
        policies:
            - name: errors
              type: status_code
              status_code:
                  status_codes: [ERROR]
            - name: slow
              type: latency
              latency:
                  threshold_ms: 800
            - name: baseline
              type: probabilistic
              probabilistic:
                  sampling_percentage: 10

    batch:
        send_batch_size: 8192
        timeout: 5s

exporters:
    # Prometheus with its OTLP receiver enabled.
    otlp_http/metrics:
        endpoint: http://prometheus:9090/api/v1/otlp
        tls:
            insecure: true
    # Loki's native OTLP ingest.
    otlp_http/loki:
        endpoint: http://loki:3100/otlp
        tls:
            insecure: true
    otlp_grpc/tempo:
        endpoint: tempo:4317
        tls:
            insecure: true

extensions:
    health_check:
        endpoint: 0.0.0.0:13133

service:
    extensions: [health_check]
    telemetry:
        logs:
            level: info
        metrics:
            level: none # the Collector does not scrape itself through a second path (one path per metric)
    pipelines:
        traces:
            receivers: [otlp]
            processors: [memory_limiter, redaction, tail_sampling, batch]
            exporters: [otlp_grpc/tempo]
        metrics:
            receivers: [otlp]
            processors: [memory_limiter, redaction, batch]
            exporters: [otlp_http/metrics]
        logs:
            receivers: [otlp]
            processors: [memory_limiter, redaction, batch]
            exporters: [otlp_http/loki]
